<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#772b20" />
  <meta name="description" content="Tập san chào mừng 40 năm thành lập Trường THPT Bỉm Sơn 1983–2023" />
  <title>Tập san 40 năm – THPT Bỉm Sơn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Về trang đầu">
      <span class="brand-mark">40</span>
      <span><strong>Tập san kỷ niệm</strong><small>THPT Bỉm Sơn · 1983–2023</small></span>
    </a>
    <div class="top-actions">
      <button id="soundBtn" class="icon-btn" title="Bật/tắt âm thanh" aria-label="Bật/tắt âm thanh">🔊</button>
      <button id="fullscreenBtn" class="icon-btn" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button>
    </div>
  </header>

  <main>
    <section id="landing" class="landing">
      <div class="hero-copy">
        <p class="eyebrow">Dấu ấn một hành trình</p>
        <h1>40 năm<br><em>rực rỡ dưới mái trường</em></h1>
        <p class="lead">Một quyển tập san số lưu giữ những câu chuyện, ký ức và dấu mốc của các thế hệ Trường THPT Bỉm Sơn.</p>
        <button id="openBookBtn" class="primary-btn">Mở tập san <span>→</span></button>
        <p class="hint">Vuốt, bấm mũi tên hoặc dùng phím ← → để lật trang</p>
      </div>
      <div class="hero-book" aria-hidden="true">
        <div class="book-shadow"></div>
        <div class="cover-card"><img src="assets/pages/page-01.webp" alt=""></div>
      </div>
    </section>

    <section id="reader" class="reader" hidden>
      <div class="reader-head">
        <div>
          <p class="eyebrow">Đang xem</p>
          <h2 id="chapterTitle">Bìa tập san</h2>
        </div>
        <button id="closeReaderBtn" class="text-btn">Đóng ✕</button>
      </div>

      <div class="book-stage" id="bookStage">
        <button class="nav-btn prev" id="prevBtn" aria-label="Trang trước">‹</button>
        <div class="book" id="book" aria-live="polite">
          <div class="page-slot left-slot" id="leftSlot"></div>
          <div class="spine"></div>
          <div class="page-slot right-slot" id="rightSlot"></div>
        </div>
        <button class="nav-btn next" id="nextBtn" aria-label="Trang sau">›</button>
      </div>

      <div class="reader-controls">
        <span id="pageLabel">Trang 1 / 21</span>
        <input id="pageRange" type="range" min="1" max="21" value="1" aria-label="Chọn trang" />
        <button id="thumbBtn" class="text-btn">Mục lục</button>
      </div>
    </section>
  </main>

  <aside id="thumbPanel" class="thumb-panel" aria-hidden="true">
    <div class="panel-head"><h3>Mục lục</h3><button id="closeThumbBtn" class="icon-btn">✕</button></div>
    <div id="thumbGrid" class="thumb-grid"></div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <dialog id="zoomDialog" class="zoom-dialog">
    <button id="closeZoomBtn" class="zoom-close">✕</button>
    <img id="zoomImage" alt="Trang tập san phóng to" />
  </dialog>

  <script src="script.js"></script>
</body>
</html>
